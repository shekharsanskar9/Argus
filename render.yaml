# Render Blueprint: New > Blueprint, pick this repo.
# PyTorch + EasyOCR use ~1.1 GB idle and ~1.7 GB while reading plates, so the
# 512 MB Free / Starter instances run out of memory. Standard (2 GB) is the minimum.
services:
  - type: web
    name: argus
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Weights are gitignored, so Render downloads them at startup.
      # A Google Drive share link ("Anyone with the link") works as-is.
      - key: HELMET_MODEL_URL
        sync: false
      - key: SEATBELT_MODEL_URL
        sync: false
